name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check src scripts tests

      - name: Run tests
        run: pytest

      - name: End-to-end pipeline smoke test
        run: |
          python scripts/generate_sample_data.py --rows 5000 --out data/raw/ci_logs.csv
          python -m kpi_pipeline.cli --raw-dir data/raw --out-dir data/processed --format csv,parquet
          ls -la data/processed
